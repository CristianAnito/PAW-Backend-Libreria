<VirtualHost *:${PORT}>
    # Solo public/ es accesible desde Internet (front controller, .htaccess).
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Permite el .htaccess (reescritura de URLs hacia index.php).
        AllowOverride All
        Require all granted
        # Sin listado de archivos de las carpetas.
        Options -Indexes
    </Directory>

    # Los registros de Apache van a la salida del contenedor (pestaña "Logs" de Render).
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
